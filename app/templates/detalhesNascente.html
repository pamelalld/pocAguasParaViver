<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Nascente</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

img{
    width:100%;
    max-height:350px;
    object-fit:cover;
    border-radius:8px;
}

.info{
    margin-top:20px;
}

.info p{
    margin:10px 0;
}

.acoes{
    margin-top:30px;
    display:flex;
    gap:15px;
}

.botao{
    flex:1;
    text-align:center;
    text-decoration:none;
    padding:14px;
    border-radius:6px;
    color:white;
}

.editar{
    background:#333;
}

.historico{
    background:#0d6efd;
}

.voltar{
    background:#777;
}

</style>

</head>

<body>

<div class="container">

<h1>Nascente</h1>

<img src="{{ url_for('static', filename='uploads/' + nascente.imagem) }}">

<div class="info">

<p><strong>Endereço:</strong> {{ nascente.endereco }}</p>

<p><strong>Descrição:</strong> {{ nascente.descricao }}</p>

<p><strong>Status:</strong> {{ nascente.status }}</p>

</div>

<div class="acoes">

<a
class="botao editar"
href="{{ url_for('editarNascente', id=nascente.id) }}">
Editar
</a>

<a
class="botao historico"
href="{{ url_for('historicoNascente', id=nascente.id) }}">
Ver histórico
</a>

<a
class="botao voltar"
href="{{ url_for('dashboardNascentes') }}">
Voltar
</a>

</div>

</div>

</body>
</html>
