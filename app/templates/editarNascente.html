<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Editar Nascente</title>

    <style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 30px;
    background-color: #f5f5f5;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

h1 {
    margin-top: 0;
    margin-bottom: 30px;
}


/* IMAGEM ATUAL */

.imagem-atual {
    margin-bottom: 30px;
}

.imagem-atual p {
    font-weight: bold;
    margin-bottom: 10px;
}

.imagem-atual img {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 8px;
}


/* INFORMAÇÕES DA NASCENTE */

.informacoes {
    margin-bottom: 25px;
    padding: 15px;
    background-color: #f5f5f5;
    border-radius: 8px;
}

.campo {
    margin-bottom: 20px;
}

.informacoes .campo {
    margin-bottom: 15px;
}

.informacoes .campo:last-child {
    margin-bottom: 0;
}

.campo label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.informacoes p {
    margin: 0;
    padding: 10px;
    background-color: white;
    border-radius: 5px;
    color: #444;
}


/* CAMPOS EDITÁVEIS */

textarea {
    width: 100%;
    min-height: 120px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    resize: vertical;
}

textarea:focus {
    outline: none;
    border-color: #555;
}


/* IMAGEM */

input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: white;
    font-size: 14px;
}

.ajuda {
    margin-top: 6px;
    font-size: 13px;
    color: #666;
}


/* BOTÕES */

.botoes {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 30px;
}

.botao {
    padding: 12px 20px;
    border: none;
    border-radius: 5px;
    text-decoration: none;
    font-size: 15px;
    cursor: pointer;
}

.voltar {
    margin-right: auto;
    background-color: #ddd;
    color: #222;
}

.salvar {
    background-color: #333;
    color: white;
}

.validar {
    background-color: #333;
    color: white;
}

.invalidar {
    background-color: #ddd;
    color: #222;
}

.botao:hover {
    opacity: 0.85;
}

    </style>

</head>

<body>

<div class="container">

    <h1>Editar Nascente</h1>

    <!-- IMAGEM ATUAL -->

    <div class="imagem-atual">

        <p>Imagem atual:</p>

        <img
            src="{{ url_for('static', filename='uploads/' + nascente.imagem) }}"
            alt="Imagem da nascente"
        >

    </div>


    <!-- FORMULÁRIO -->


    <form
        action="{{ url_for('editarNascente', id=nascente.id) }}"
        method="POST"
        enctype="multipart/form-data"
    >

        <!-- INFORMAÇÕES DA NASCENTE -->

        <div class="informacoes">

            <div class="campo">

                <label>
                    Endereço
                </label>

                <p>
                    {{ nascente.endereco }}
                </p>

            </div>


            <div class="campo">

                <label>
                    Latitude
                </label>

                <p>
                    {{ nascente.latitude }}
                </p>

            </div>


            <div class="campo">

                <label>
                    Longitude
                </label>

                <p>
                    {{ nascente.longitude }}
                </p>

            </div>

        </div>


        <!-- DESCRIÇÃO -->

        <div class="campo">

            <label for="descricao">
                Descrição
            </label>

            <textarea
                id="descricao"
                name="descricao"
            >{{ nascente.descricao }}</textarea>

        </div>


        <!-- IMAGEM -->

        <div class="campo">

            <label for="imagem">
                Nova imagem
            </label>

            <input
                type="file"
                id="imagem"
                name="imagem"
                accept="image/*"
            >

            <p class="ajuda">
                Caso nenhuma imagem seja selecionada, a imagem atual será mantida.
            </p>

        </div>


        <!-- BOTÕES -->

        <div class="botoes">

            <a
                href="{{ url_for('dashboardNascentes') }}"
                class="botao voltar"
            >
                Voltar
            </a>


            {% if nascente.status == "PENDENTE" %}

                <button
                    type="submit"
                    name="acao"
                    value="validar"
                    class="botao validar"
                >
                    Validar
                </button>

                <button
                    type="submit"
                    name="acao"
                    value="invalidar"
                    class="botao invalidar"
                >
                    Invalidar
                </button>


            {% elif nascente.status == "APROVADA" %}

                <button
                    type="submit"
                    name="acao"
                    value="salvar"
                    class="botao salvar"
                >
                    Salvar mudanças
                </button>

                <button
                    type="submit"
                    name="acao"
                    value="invalidar"
                    class="botao invalidar"
                >
                    Invalidar nascente
                </button>

            {% endif %}

        </div>

    </form>


</div>

</body>

</html>
