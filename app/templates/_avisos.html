{% with mensagens = get_flashed_messages(with_categories=true) %}
  {% if mensagens %}
    <div class="avisos" role="status">
      {% for categoria, mensagem in mensagens %}
        <p class="aviso aviso-{{ 'erro' if categoria == 'error' else ('sucesso' if categoria == 'success' else 'info') }}">{{ mensagem }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
