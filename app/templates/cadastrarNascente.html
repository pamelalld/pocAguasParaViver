<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Nascente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .formulario {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="formulario">
    <h1>Cadastrar Nascente</h1>

    <form action="/mapa/registrar" method="POST" enctype="multipart/form-data">

        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" required>

        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">

        <label for="imagem">Imagem</label>
        <input type="file" id="imagem" name="imagem" accept="image/*" required>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao"></textarea>

        <button type="submit">Cadastrar nascente</button>
        <button type="button" onclick="history.back()">Cancelar</button>

    </form>
</div>

<script>
    const parametros = new URLSearchParams(window.location.search);

    const latitude = parametros.get("latitude");
    const longitude = parametros.get("longitude");

    document.getElementById("latitude").value = latitude;
    document.getElementById("longitude").value = longitude;
</script>

</body>
</html>
