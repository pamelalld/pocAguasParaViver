{% extends "base.html" %}

{% block titulo %}Cadastrar nascente{% endblock %}

{% block conteudo %}
    <div class="painel">
        <h1>Cadastrar Nascente</h1>

        <form action="{{ url_for('cadastrarNascente') }}" method="POST" enctype="multipart/form-data">
            <div class="campo">
                <label for="endereco">Endereço</label>
                <input class="entrada" type="text" id="endereco" name="endereco" required>
            </div>

            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">

            <div class="campo">
                <label for="imagem">Imagem</label>
                <input class="entrada" type="file" id="imagem" name="imagem" accept="image/*" required>
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea class="entrada" id="descricao" name="descricao"></textarea>
            </div>

            <div class="acoes">
                <button type="submit" class="btn btn-verde">Cadastrar</button>
                <button type="button" class="btn btn-vermelho" onclick="history.back()">Cancelar</button>
            </div>
        </form>
    </div>
{% endblock %}

{% block scripts %}
    <script>
        const parametros = new URLSearchParams(window.location.search);
        const latitude = parametros.get("latitude");
        const longitude = parametros.get("longitude");

        document.getElementById("latitude").value = latitude;
        document.getElementById("longitude").value = longitude;

        const campoEndereco = document.getElementById("endereco");

        async function preencherEnderecoAutomaticamente(lat, lng) {
            if (!lat || !lng) return;

            campoEndereco.placeholder = "Buscando endereço...";
            campoEndereco.disabled = true;

            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&accept-language=pt-BR`;
                const resposta = await fetch(url);
                if (!resposta.ok) throw new Error("Falha na busca do endereço");

                const dados = await resposta.json();
                if (dados && dados.display_name) {
                    campoEndereco.value = dados.display_name;
                }
            } catch (e) {
                campoEndereco.placeholder = "Não foi possível buscar o endereço. Digite manualmente.";
            } finally {
                campoEndereco.disabled = false;
            }
        }

        preencherEnderecoAutomaticamente(latitude, longitude);
    </script>
{% endblock %}
