<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nascentes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .nascentes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
        }

        .nascente {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .nascente img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .informacoes {
            padding: 15px;
        }

        .informacoes p {
            margin: 8px 0;
        }

        .botao-cadastrar {
            position: fixed;
            bottom: 30px;
            right: 30px;

            padding: 12px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <a href="{{ url_for('cadastrarNascente') }}" class="botao-cadastrar">
        Cadastrar Nascente
    </a>

    <h1>Nascentes</h1>

    <div class="nascentes">
        {% if nascentes %}
            {% for nascente in nascentes %}
            <div class="nascente">
                <img src="{{ url_for('static', filename='uploads/' + nascente.imagem) }}">

                <div class="informacoes">
                    <p><strong>Latitude:</strong> {{ nascente.latitude }}</p>
                    <p><strong>Longitude:</strong> {{ nascente.longitude }}</p>
                    <p><strong>Descrição:</strong> {{ nascente.descricao }}</p>
                </div>
            </div>
            {% endfor %}
        {% endif %}
    </div>

</body>
</html>
